<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程安排</title>
</head>
<body>
  <h1>行程安排</h1>
  <p id="presentationInfo"></p>
  <form id="travelForm">
    <div>
      <label for="titleInput">簡報主題</label><br />
      <input type="text" id="titleInput" required />
    </div>

    <br />

    <div>
      <label for="email">Email</label><br />
      <input type="email" id="email" />
      <button type="button" id="testMailBtn">測試寄信</button>
    </div>

    <br />

    <div>
      <label for="expire">最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <button type="submit">建立行程資料</button>
  </form>

  <h3>目前產生的 travel data</h3>
  <pre id="result"></pre>
  
  <h3>localStorage內容</h3>
  <pre id="debugStorage"></pre>

<script type="module">
  import { systemConfig } from "./config/systemConfig.js";

  const form = document.getElementById("travelForm");
  const emailInput = document.getElementById("email");
  const expireInput = document.getElementById("expire");
  const result = document.getElementById("result");

const debugStorage = document.getElementById("debugStorage");

// 把 localStorage 全部印出來
function renderStorage() {
  const all = {};

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    const value = localStorage.getItem(key);
    all[key] = value;
  }

  debugStorage.textContent = JSON.stringify(all, null, 2);
}


  emailInput.required = systemConfig.requireEmail;


  const presentationInfo = document.getElementById("presentationInfo");
  
  const params = new URLSearchParams(window.location.search);
  const presentationId = params.get("presentationId");
  
if (presentationId) {
  const raw = localStorage.getItem(`presentation:${presentationId}`);

  if (raw) {
      const savedData = JSON.parse(raw);
  
      // 👇 回填表單
      document.getElementById("titleInput").value = savedData.title || "";
      emailInput.value = savedData.email || "";
      expireInput.value = savedData.expiresAt || "";
  
      presentationInfo.textContent = `編修模式：${presentationId}`;
    } else {
      presentationInfo.textContent = `找不到資料：${presentationId}`;
    }
  } else {
    presentationInfo.textContent = "新建模式";
  }
  
  
  console.log("presentationId =", presentationId);
  
  if (presentationId) {
    presentationInfo.textContent = `目前簡報 ID：${presentationId}`;
  } else {
    presentationInfo.textContent = "目前為新建簡報";
  }


  function formatDateLocal(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  const today = new Date();
  const maxDate = new Date();
  maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

  const minDateStr = formatDateLocal(today);
  const maxDateStr = formatDateLocal(maxDate);

  expireInput.min = minDateStr;
  expireInput.max = maxDateStr;

  const params = new URLSearchParams(window.location.search);
  const presentationId = params.get("presentationId");

console.log("presentationId =", presentationId);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    console.log("👉 按下建立簡報");

    const selectedDate = expireInput.value;

    if (!selectedDate) {
      alert("請選擇最後保留日");
      return;
    }

    if (selectedDate < minDateStr || selectedDate > maxDateStr) {
      alert(`最後保留日需介於 ${minDateStr} ~ ${maxDateStr}`);
      return;
    }

    const travelData = {
      id: crypto.randomUUID(),
      type: "travel",
      title: document.getElementById("titleInput").value,
      email: emailInput.value,
      expiresAt: selectedDate
    };
    
    localStorage.setItem(
      `presentation:${travelData.presentationId}`,
      JSON.stringify(travelData)
    );

    result.textContent = JSON.stringify(travelData, null, 2);
    console.log("travelData:", travelData);

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(travelData)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "建立失敗");
      }

      alert("簡報已建立，並已寄送通知信 📩");

      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `${travelData.title || "presentation"}.pptx`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.URL.revokeObjectURL(url);
    } catch (err) {
      alert(err.message || "建立失敗");
      console.error(err);
    }
  });

  // 寄信測試
  document.getElementById("testMailBtn").addEventListener("click", async () => {
    try {
      const email = emailInput.value;

      if (!email) {
        alert("請先填寫 email");
        return;
      }

      const res = await fetch("/api/send-test-email", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      alert(data.message || data.error || "完成");
    } catch (err) {
      alert("寄信測試失敗");
      console.error(err);
    }
  });
</script>
</body>
</html>
