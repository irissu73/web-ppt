<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程安排編修</title>
</head>
<body>
  <h1>行程安排編修</h1>
  <p id="presentationInfo"></p>

  <form id="travelForm">
    <div>
      <label for="titleInput">簡報主題</label><br />
      <input type="text" id="titleInput" required />
    </div>

    <br />

    <div>
      <label for="email">Email</label><br />
      <input type="email" id="email" />
    </div>

    <br />

    <div>
      <label for="expire">最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <div>
      <label for="days">天數</label><br />
      <input type="number" id="days" min="1" max="10" value="1" />
    </div>

    <br />

    <div>
      <label for="location">地點</label><br />
      <input type="text" id="location" />
    </div>

    <br />

    <button type="submit" id="submitBtn">更新行程資料</button>
  </form>

  <h3>目前資料</h3>
  <pre id="result"></pre>

  <script type="module">
    import { systemConfig } from "./config/systemConfig.js";

    const form = document.getElementById("travelForm");
    const titleInput = document.getElementById("titleInput");
    const emailInput = document.getElementById("email");
    const expireInput = document.getElementById("expire");
    const daysInput = document.getElementById("days");
    const locationInput = document.getElementById("location");
    const result = document.getElementById("result");
    const presentationInfo = document.getElementById("presentationInfo");

    const params = new URLSearchParams(window.location.search);
    const presentationId = params.get("presentationId");

    emailInput.required = systemConfig.requireEmail;

    function formatDateLocal(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

    const minDateStr = formatDateLocal(today);
    const maxDateStr = formatDateLocal(maxDate);

    expireInput.min = minDateStr;
    expireInput.max = maxDateStr;

    async function loadPresentation() {
      if (!presentationId) {
        presentationInfo.textContent = "請先從首頁建立簡報";
        form.style.display = "none";
        return;
      }

      presentationInfo.textContent = `讀取中：${presentationId}`;

      try {
        const res = await fetch(`/api/get-presentation?presentationId=${encodeURIComponent(presentationId)}`);

        if (!res.ok) {
          presentationInfo.textContent = `找不到資料：${presentationId}`;
          form.style.display = "none";
          return;
        }

        const data = await res.json();

        titleInput.value = data.title || "";
        emailInput.value = data.email || "";
        expireInput.value = data.expiresAt || "";
        daysInput.value = data.data?.days || 1;
        locationInput.value = data.data?.location || "";

        result.textContent = JSON.stringify(data, null, 2);
        presentationInfo.textContent = `編修模式：${presentationId}`;
      } catch (err) {
        console.error(err);
        presentationInfo.textContent = "讀取資料失敗";
        form.style.display = "none";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const selectedDate = expireInput.value;

      if (!presentationId) {
        alert("缺少 presentationId");
        return;
      }

      if (!titleInput.value.trim()) {
        alert("請輸入簡報主題");
        return;
      }

      if (systemConfig.requireEmail && !emailInput.value.trim()) {
        alert("請填寫 Email");
        return;
      }

      if (!selectedDate) {
        alert("請選擇最後保留日");
        return;
      }

      if (selectedDate < minDateStr || selectedDate > maxDateStr) {
        alert(`最後保留日需介於 ${minDateStr} ～ ${maxDateStr}`);
        return;
      }

      const payload = {
        presentationId,
        type: "travel",
        title: titleInput.value.trim(),
        email: emailInput.value.trim(),
        expiresAt: selectedDate,
        data: {
          days: Number(daysInput.value || 1),
          location: locationInput.value.trim()
        }
      };

      try {
        const saveRes = await fetch("/api/save-presentation", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const saveJson = await saveRes.json().catch(() => ({}));

        if (!saveRes.ok) {
          alert(saveJson.detail || saveJson.error || "更新失敗");
          return;
        }

        result.textContent = JSON.stringify(payload, null, 2);
        alert("已更新行程資料");
      } catch (err) {
        console.error(err);
        alert("發生錯誤，請稍後再試");
      }
    });

    loadPresentation();
  </script>
</body>
</html>
