<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程安排</title>
</head>
<body>
  <h1>行程安排</h1>

  <form id="travelForm">
    <div>
      <label for="titleInput">簡報主題</label><br />
      <input type="text" id="titleInput" required />
    </div>

    <br />

    <div>
      <label for="email">Email</label><br />
      <input type="email" id="email" />
      <button type="button" id="testMailBtn">測試寄信</button>
    </div>

    <br />

    <div>
      <label for="expire">最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <button type="submit">建立行程資料</button>
  </form>

  <h3>目前產生的 travel data</h3>
  <pre id="result"></pre>

  <script type="module">
    import { systemConfig } from "./config/systemConfig.js";

    const form = document.getElementById("travelForm");
    const emailInput = document.getElementById("email");
    const expireInput = document.getElementById("expire");
    const result = document.getElementById("result");

    emailInput.required = systemConfig.requireEmail;

    function formatDateLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

    expireInput.min = formatDateLocal(today);
    expireInput.max = formatDateLocal(maxDate);

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const travelData = {
        id: crypto.randomUUID(),
        type: "travel",
        title: document.getElementById("titleInput").value,
        email: emailInput.value,
        expiresAt: expireInput.value
      };

      result.textContent = JSON.stringify(travelData, null, 2);
      console.log("travelData:", travelData);
    });
    
//寄信
document.getElementById("testMailBtn").addEventListener("click", async () => {
  try {
    const email = emailInput.value;

    if (!email) {
      alert("請先填寫 email");
      return;
    }

    const res = await fetch("/api/send-test-email", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    alert(data.message || data.error || "完成");
  } catch (err) {
    alert("寄信測試失敗");
    console.error(err);
  }
});

//寄信（止）
  </script>
</body>
</html>
