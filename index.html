<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 幫你做簡報</title>
</head>

<body>
  <h1>AI 幫你做簡報</h1>

  <form id="form">
    <div>
      <label>簡報類型</label><br />
      <select id="type">
        <option value="travel">行程安排</option>
        <option value="compare">比較分析</option>
        <option value="lesson">教學簡報</option>
        <option value="proposal">提案簡報</option>
      </select>
    </div>

    <br />

    <div>
      <label>簡報主題</label><br />
      <input type="text" id="title" required />
    </div>

    <br />

    <div>
      <label>Email</label><br />
      <input type="email" id="email" />
    </div>

    <br />

    <div>
      <label>最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <button type="submit">建立簡報</button>
  </form>

  <h3>目前送出的資料</h3>
  <pre id="result"></pre>

  <script type="module">
    import { systemConfig } from "./config/systemConfig.js";

    const form = document.getElementById("form");
    const result = document.getElementById("result");

    const emailInput = document.getElementById("email");
    const expireInput = document.getElementById("expire");

    emailInput.required = systemConfig.requireEmail;

    function formatDateLocal(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    // ===== 日期限制 =====
    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

    const minDateStr = formatDateLocal(today);
    const maxDateStr = formatDateLocal(maxDate);

    expireInput.min = minDateStr;
    expireInput.max = maxDateStr;

    // ===== submit =====
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const email = emailInput.value.trim();
      const type = document.getElementById("type").value;
      const expiresAt = expireInput.value;

      if (!title) {
        alert("請輸入主題");
        return;
      }

      if (systemConfig.requireEmail && !email) {
        alert("請填寫 Email");
        return;
      }

      if (!expiresAt) {
        alert("請選擇日期");
        return;
      }

      if (expiresAt < minDateStr || expiresAt > maxDateStr) {
        alert(`日期需介於 ${minDateStr} ～ ${maxDateStr}`);
        return;
      }

      const presentationId = crypto.randomUUID();

      const payload = {
        presentationId,
        type,
        title,
        email,
        expiresAt,
        data: {}
      };

      result.textContent = JSON.stringify(payload, null, 2);

      try {
        // 👉 直接打 generate（裡面已包含寄信）
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert(err.error || "建立失敗");
          return;
        }

        alert("簡報已建立，信件已寄出");

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `${title || "presentation"}.pptx`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        window.URL.revokeObjectURL(url);

      } catch (err) {
        console.error(err);
        alert("發生錯誤");
      }
    });
  </script>
</body>
</html>
