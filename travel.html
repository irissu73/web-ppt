<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程安排</title>
</head>

<body>
  <h1>行程安排</h1>

  <p id="presentationInfo"></p>

  <form id="travelForm">
    <div>
      <label>簡報主題</label><br />
      <input type="text" id="titleInput" required />
    </div>

    <br />

    <div>
      <label>Email</label><br />
      <input type="email" id="email" />
    </div>

    <br />

    <div>
      <label>最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <button type="submit">建立行程資料</button>
  </form>

  <h3>目前產生的 travel data</h3>
  <pre id="result"></pre>

  <h3>localStorage內容</h3>
  <pre id="debugStorage"></pre>

<script type="module">
  import { systemConfig } from "./config/systemConfig.js";

  const form = document.getElementById("travelForm");
  const emailInput = document.getElementById("email");
  const expireInput = document.getElementById("expire");
  const result = document.getElementById("result");
  const presentationInfo = document.getElementById("presentationInfo");
  const debugStorage = document.getElementById("debugStorage");

  emailInput.required = systemConfig.requireEmail;

  function formatDateLocal(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function renderStorage() {
    const all = {};

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const value = localStorage.getItem(key);
      all[key] = value;
    }

    if (Object.keys(all).length === 0) {
      debugStorage.textContent = "目前沒有任何資料";
    } else {
      debugStorage.textContent = JSON.stringify(all, null, 2);
    }
  }

  const today = new Date();
  const maxDate = new Date();
  maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

  const minDateStr = formatDateLocal(today);
  const maxDateStr = formatDateLocal(maxDate);

  expireInput.min = minDateStr;
  expireInput.max = maxDateStr;

  const params = new URLSearchParams(window.location.search);
  const presentationId = params.get("presentationId");

  async function initPage() {
    if (presentationId) {
      presentationInfo.textContent = `讀取中：${presentationId}`;

      try {
        const res = await fetch(`/api/get-presentation?presentationId=${presentationId}`);

        if (!res.ok) {
          presentationInfo.textContent = `找不到資料：${presentationId}`;
        } else {
          const data = await res.json();

          document.getElementById("titleInput").value = data.title || "";
          emailInput.value = data.email || "";
          expireInput.value = data.expiresAt || "";

          presentationInfo.textContent = `編修模式：${presentationId}`;
        }
      } catch (err) {
        console.error("initPage error:", err);
        presentationInfo.textContent = "讀取資料失敗";
      }
    } else {
      presentationInfo.textContent = "新建模式";
    }

    renderStorage();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const selectedDate = expireInput.value;

    if (!selectedDate) {
      alert("請選擇日期");
      return;
    }

    const travelData = {
      presentationId: presentationId || crypto.randomUUID(),
      type: "travel",
      title: document.getElementById("titleInput").value,
      email: emailInput.value,
      expiresAt: selectedDate,
      data: {
        days: 1,
        location: ""
      }
    };

    localStorage.setItem(
      `presentation:${travelData.presentationId}`,
      JSON.stringify(travelData)
    );

    result.textContent = JSON.stringify(travelData, null, 2);
    renderStorage();

    try {
      const saveRes = await fetch("/api/save-presentation", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(travelData)
});

const saveJson = await saveRes.json().catch(() => ({}));
console.log("saveJson =", saveJson);

if (!saveRes.ok) {
  alert(saveJson.detail || saveJson.error || "儲存失敗");
  return;
}

      const res = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(travelData)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "建立失敗");
      }

      alert("已建立（已存 Supabase）");

      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `${travelData.title || "presentation"}.pptx`;
      a.click();

      window.URL.revokeObjectURL(url);
    } catch (err) {
      console.error("submit error:", err);
      alert(err.message || "建立失敗");
    }
  });

  initPage();
</script>
</body>
</html>
