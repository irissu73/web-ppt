<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>建立簡報</title>
</head>
<body>

<h2 id="pageTitle"></h2>

<form id="form">
  
  <div>
    <label>簡報主題</label><br/>
    <input type="text" id="titleInput" required />
  </div>

  <br/>

  <div>
    <label>Email（用來寄送編輯網址）</label><br/>
    <input type="email" id="email" required />
  </div>

  <br/>

  <div>
    <label>最後保留日（最多30天）</label><br/>
    <input type="date" id="expire" required />
  </div>

  <br/>

  <button type="submit">建立簡報</button>

</form>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type");

const titleMap = {
  travel: "行程安排",
  compare: "比較分析",
  lesson: "教學說明",
  proposal: "提案簡報"
};

document.getElementById("pageTitle").innerText = "建立：" + titleMap[type];

const today = new Date();
const maxDate = new Date();
maxDate.setDate(today.getDate() + 30);

function formatDateLocal(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

const expireInput = document.getElementById("expire");
expireInput.min = formatDateLocal(today);
expireInput.max = formatDateLocal(maxDate);

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = e.submitter || document.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = "產生中...";

  try {
    const data = {
      type,
      title: document.getElementById("titleInput").value,
      email: document.getElementById("email").value,
      expiresAt: document.getElementById("expire").value
    };

    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "產生失敗");
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${data.title || "presentation"}.pptx`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    window.URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message || "發生錯誤");
  } finally {
    btn.disabled = false;
    btn.textContent = "建立簡報";
  }
});
</script>

</body>
</html>
