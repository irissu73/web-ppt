<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程安排</title>
</head>

<body>
  <h1>行程安排</h1>

  <p id="presentationInfo"></p>

  <form id="travelForm">
    <div>
      <label>簡報主題</label><br />
      <input type="text" id="titleInput" required />
    </div>

    <br />

    <div>
      <label>Email</label><br />
      <input type="email" id="email" />
    </div>

    <br />

    <div>
      <label>最後保留日</label><br />
      <input type="date" id="expire" required />
    </div>

    <br />

    <button type="submit">建立行程資料</button>
  </form>

  <h3>目前產生的 travel data</h3>
  <pre id="result"></pre>

  <h3>localStorage內容</h3>
  <pre id="debugStorage"></pre>

  <script type="module">
    import { systemConfig } from "./config/systemConfig.js";

    const form = document.getElementById("travelForm");
    const emailInput = document.getElementById("email");
    const expireInput = document.getElementById("expire");
    const result = document.getElementById("result");
    const presentationInfo = document.getElementById("presentationInfo");
    const debugStorage = document.getElementById("debugStorage");

    emailInput.required = systemConfig.requireEmail;

    // ===== 日期限制 =====
    function formatDateLocal(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + systemConfig.maxExpireDays);

    const minDateStr = formatDateLocal(today);
    const maxDateStr = formatDateLocal(maxDate);

    expireInput.min = minDateStr;
    expireInput.max = maxDateStr;

    // ===== 讀網址 presentationId =====
    const params = new URLSearchParams(window.location.search);
    const presentationId = params.get("presentationId");

    console.log("presentationId =", presentationId);

    // ===== 顯示 localStorage =====
    function renderStorage() {
      const all = {};

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        all[key] = value;
      }

      if (Object.keys(all).length === 0) {
        debugStorage.textContent = "目前沒有任何資料";
      } else {
        debugStorage.textContent = JSON.stringify(all, null, 2);
      }
    }

    // ===== 讀資料回填（編修模式） =====
    if (presentationId) {
      const raw = localStorage.getItem(`presentation:${presentationId}`);

      if (raw) {
        const data = JSON.parse(raw);

        document.getElementById("titleInput").value = data.title || "";
        emailInput.value = data.email || "";
        expireInput.value = data.expiresAt || "";

        presentationInfo.textContent = `編修模式：${presentationId}`;
      } else {
        presentationInfo.textContent = `找不到資料：${presentationId}`;
      }
    } else {
      presentationInfo.textContent = "新建模式";
    }

    renderStorage();

    // ===== submit =====
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const selectedDate = expireInput.value;

  if (!selectedDate) {
    alert("請選擇日期");
    return;
  }

  const travelData = {
    presentationId: presentationId || crypto.randomUUID(),
    type: "travel",
    title: document.getElementById("titleInput").value,
    email: emailInput.value,
    expiresAt: selectedDate,
    data: {
      days: 1,
      location: ""
    }
  };

  // =====（可保留）存 localStorage =====
  localStorage.setItem(
    `presentation:${travelData.presentationId}`,
    JSON.stringify(travelData)
  );

  result.textContent = JSON.stringify(travelData, null, 2);
  renderStorage();

  // ===== 👉 這裡：寫進 Supabase（新加的）=====
  const saveRes = await fetch("/api/save-presentation", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(travelData)
  });

  if (!saveRes.ok) {
    const err = await saveRes.json().catch(() => ({}));
    alert(err.error || "儲存失敗");
    return;
  }

  // ===== 👉 原本的 generate（不要動）=====
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(travelData)
    });

    if (!res.ok) {
      alert("建立失敗");
      return;
    }

    alert("已建立（已存 Supabase）");

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${travelData.title || "presentation"}.pptx`;
    a.click();

    window.URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    alert("API錯誤");
  }
});
  </script>
</body>
</html>
